<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EYYA Sense for Rail — Restricted Access</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#def1fa 0,transparent 55%),#eef3f6;color:#123e59;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:440px;padding:38px 36px 26px;background:#fff;border:1px solid #d2e1e9;border-top:4px solid #21a9df;border-radius:18px;box-shadow:0 18px 60px #173b5812}
.brand-header{display:flex;align-items:center;gap:20px;padding-bottom:26px;margin-bottom:26px;border-bottom:1px solid #e3edf2}
.brand-mark{width:58px;height:58px;object-fit:contain;flex:none}
.brand{font-size:26px;font-weight:700;letter-spacing:.01em;line-height:1.2;margin:0 0 6px;text-wrap:balance}
h1{font-size:16px;margin:0;font-weight:500;color:#617c8d}
label{display:block;margin-bottom:11px;font-size:15px;font-weight:500}
input,button{width:100%;font:inherit;border-radius:10px}
input{height:62px;padding:12px 12px 12px 28px;border:1px solid #b6cbd8;background:#f8fbfd;font-size:28px;letter-spacing:16px;text-align:center;color:#123e59;transition:border-color .15s,box-shadow .15s}
input:focus{outline:3px solid #b6e3f4;border-color:#0084b6;background:#fff}
input::-ms-reveal,input::-ms-clear{display:none}
button{margin-top:20px;padding:14px;background:#007fae;color:#fff;border:0;font-weight:600;cursor:pointer;box-shadow:0 4px 12px #007fae20;transition:background .15s}
button:hover:not(:disabled){background:#006b95}button:focus-visible{outline:3px solid #84ceef;outline-offset:3px}button:disabled{opacity:.65;cursor:wait}
#error{font-size:14px;min-height:21px;margin:12px 0 0;color:#ae253c}
.note{color:#627d8f;font-size:14px;text-align:center;margin:12px 0 0}
@media(max-width:380px){body{padding:16px}main{padding:28px 24px 22px}.brand-header{gap:16px}.brand{font-size:24px}}
</style>
</head>
<body>
<main><header class="brand-header"><img class="brand-mark" src="assets/eyya-brandmark.svg" width="58" height="58" alt="Eyya"><div><p class="brand">EYYA Sense for Rail</p><h1>Restricted Access</h1></div></header>
<form id="access-form"><label for="access-code">Please enter access code</label>
<input id="access-code" name="password" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" required autofocus aria-describedby="error">
<button id="unlock" type="submit">Enter</button><p id="error" role="status" aria-live="polite"></p></form>
<p class="note">Access for authorised viewers.</p><noscript>JavaScript is required to unlock this page.</noscript></main>

<script>__STATICRYPT_RUNTIME__</script>
<script>__ACCESS_RUNTIME__</script>
</body></html>
