      error.textContent = 'Unable to unlock this page. Please reload and try again.';
    }
    button.disabled = false;
    button.textContent = 'Enter';
    input.focus();
  });
  const saved = readKey();
  if (saved) {
    button.disabled = true;
    try { if (await unlock(saved)) return; } catch {}
    clearKey();
    button.disabled = false;
  }
})();
</script>
</body></html>
