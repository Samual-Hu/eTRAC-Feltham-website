<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#def1fa 0,transparent 55%),#eef3f6;color:#123e59;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:440px;padding:38px 36px 26px;background:#fff;border:1px solid #d2e1e9;border-top:4px solid #21a9df;border-radius:18px;box-shadow:0 18px 60px #173b5812}
.brand-header{display:flex;align-items:center;gap:20px;padding-bottom:26px;margin-bottom:26px;border-bottom:1px solid #e3edf2}
.brand-mark{width:58px;height:58px;object-fit:contain;flex:none}
.brand{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.15;margin:0 0 6px}

input:focus{outline:3px solid #b6e3f4;border-color:#0084b6;background:#fff}

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!/^[0-9]{4}$/.test(input.value)) {
      error.textContent = 'Enter a four-digit access code.';
      return;
    }
    button.disabled = true;
    button.textContent = 'Unlocking…';
    error.textContent = '';
    try {
      const key = await etackCrypto.hashPassword(input.value, payload.salt);
      input.value = '';
      if (await unlock(key)) return;
      clearKey();
      error.textContent = 'Incorrect access code. Please try again.';
    } catch {
      error.textContent = 'Unable to unlock this page. Please reload and try again.';
    }
    button.disabled = false;
    button.textContent = 'Enter';
    input.focus();
  });
  const saved = readKey();
  if (saved) {
    button.disabled = true;
    try { if (await unlock(saved)) return; } catch {}
    clearKey();
    button.disabled = false;
  }
})();
</script>
</body></html>
